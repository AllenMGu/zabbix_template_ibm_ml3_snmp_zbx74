zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 5f436cd6c7df45babbbd9611217f2557
      name: 'Templates/Kstar UPS'
  templates:
    - uuid: e2c7ce4b455a4d95a2fd226f73cbd50f
      template: 'Kstar UPS PPC by SNMP'
      name: 'Kstar UPS PPC by SNMP'
      description: |
        Kstar UPS SNMP card template generated from the uploaded PPC MIB. Supports SNMP polling, table discovery, basic UPS health triggers, graphs, and SNMP trap capture.
        
        Revision v3: optional PPC MIB branches that commonly return No Such Object on Kstar SNMP cards are disabled by default to keep Latest data clean. Core UPS health/battery/input/output/bypass/environment items remain enabled.
        
        V4 updates:
        - Environment security trigger now alarms only on abnormal(2); value 0 is treated as not-installed/unused to avoid false alarms on empty dry-contact/security channels.
        - Smart battery temperature and three-phase battery temperature are scaled by 0.1 according to the PPC point table.
        - Temperature trigger names are split to identify smart vs three-phase battery source.
      groups:
        - name: 'Templates/Kstar UPS'
      items:
        - uuid: ff99e26f66df4b24bf6eef1fd961c61e
          name: 'Kstar PPC: mconfig traps receivers entry walk'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.935.2.1.2.1]'
          key: kstar.ppc.mconfig.traps.receivers.entry.walk
          delay: 5m
          history: '0'
          value_type: TEXT
          status: DISABLED
          description: |
            Master SNMP walk item used by dependent discovery rules and item prototypes. Uses table entry root walk[] OID to avoid Zabbix import snmp_oid length limits.
            
            Disabled in v3 because this optional PPC OID/table is not implemented on some Kstar SNMP cards and appears as unsupported. Enable manually only if snmpwalk confirms this OID exists on your card.
          tags:
            - tag: component
              value: config
            - tag: role
              value: raw
        - uuid: e6b39b2de25e464caa645c158c632759
          name: 'Kstar PPC: mconfig traps receivers num'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.935.2.1.1.0
          key: kstar.ppc.mconfig.traps.receivers.num
          delay: 1h
          history: 30d
          description: 'The number of managers to send traps to.'
          tags:
            - tag: component
              value: config
        - uuid: 3b7ef90b83fa4988b2564e9bc5d861ea
          name: 'Kstar PPC: UPS base battery last replace date'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.935.1.1.1.2.1.3.0
          key: kstar.ppc.ups.base.battery.last.replace.date
          delay: 1h
          history: 30d
          value_type: CHAR
          description: 'The date when the UPS system''s batteries were last replaced in mm/dd/yy format. For UPS models, this value is originally set in the factory. When the UPS batteries are replaced, this value should be reset by the administrator.'
          tags:
            - tag: component
              value: battery
        - uuid: af6d131a067e4e1db2ecb8f77d318301
          name: 'Kstar PPC: UPS base battery status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.935.1.1.1.2.1.1.0
          key: kstar.ppc.ups.base.battery.status
          history: 30d
          description: 'The status of the UPS batteries. A batteryLow(3) value indicates the UPS will be unable to sustain the current load, and its services will be lost if power is not restored. The amount of run time in reserve at the time of low battery can be configured by the upsSmartConfigLowBatteryRunTime.'
          valuemap:
            name: 'Kstar PPC::upsBaseBatteryStatus'
          tags:
            - tag: component
              value: battery
          triggers:
            - uuid: 1fda9f468dec4a1fbcea73b4cc1a4bf5
              expression: 'last(/Kstar UPS PPC by SNMP/kstar.ppc.ups.base.battery.status)=3'
              name: 'Kstar PPC: Battery status is not normal'
              opdata: 'Current status: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'UPS battery status is batteryLow(3).'
              tags:
                - tag: scope
                  value: availability
        - uuid: 7cadf4f0c9074b1682280982bb1d7ca4
          name: 'Kstar PPC: UPS base battery time on battery'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.935.1.1.1.2.1.2.0
          key: kstar.ppc.ups.base.battery.time.on.battery
          history: 30d
          units: s
          description: 'The elapsed time in seconds since the UPS has switched to battery power.'
          tags:
            - tag: component
              value: battery
        - uuid: 8acc9578eeec44d4b9783ddc39aa490f
          name: 'Kstar PPC: UPS base config device entry walk'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.935.1.1.1.5.1.2.1]'
          key: kstar.ppc.ups.base.config.device.entry.walk
          delay: 5m
          history: '0'
          value_type: TEXT
          status: DISABLED
          description: |
            Master SNMP walk item used by dependent discovery rules and item prototypes. Uses table entry root walk[] OID to avoid Zabbix import snmp_oid length limits.
            
            Disabled in v3 because this optional PPC OID/table is not implemented on some Kstar SNMP cards and appears as unsupported. Enable manually only if snmpwalk confirms this OID exists on your card.
          tags:
            - tag: component
              value: config
            - tag: role
              value: raw
        - uuid: 5ff1160bf7964dd0b5f88a264bb2bde1
          name: 'Kstar PPC: UPS base config num devices'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.935.1.1.1.5.1.1.0
          key: kstar.ppc.ups.base.config.num.devices
