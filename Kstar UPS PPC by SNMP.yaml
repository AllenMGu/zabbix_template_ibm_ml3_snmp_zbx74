              opdata: 'Current status: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'PPC MIB upsBaseOutputStatus onLine is 2.'
              tags:
                - tag: scope
                  value: availability
        - uuid: d71c72303f1d487f9560530a073f894b
