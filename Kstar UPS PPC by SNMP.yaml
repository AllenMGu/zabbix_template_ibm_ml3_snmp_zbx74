          description: 'The number of devices that are plugged into the UPS.'
          tags:
            - tag: component
              value: config
        - uuid: 9300ccfd63f84489963b4494598ba96e
          name: 'Kstar PPC: UPS base control conserve battery'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.935.1.1.1.6.1.1.0
          key: kstar.ppc.ups.base.control.conserve.battery
          history: 30d
          description: 'Setting this variable to turnUpsOffToConserveBattery(2) causes a UPS on battery to be put into ''sleep'' mode immediately. The (10) means suspending time(10 minutes) before turn off UPS. UPS will turn back on when utility power is restored. Attempting to turn off a UPS that is not on battery will result in a badValue error. Setting this value to noTurnOffUps(1) has no effect. The value noTurnOffUps(1) will always be returned when the variable is read.'
          valuemap:
            name: 'Kstar PPC::upsBaseControlConserveBattery'
          tags:
            - tag: component
              value: battery
        - uuid: 2add2876ebac477fa3eddab42eb718ff
