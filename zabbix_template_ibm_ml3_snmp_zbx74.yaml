zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 15981e24533845f6bdffb9a4405602a5
    name: Templates/IBM ML3
  templates:
  - uuid: e031f9a38ad34052a6ea55c3915df7e0
    template: IBM ML3 Tape Library by SNMP
    name: IBM ML3 Tape Library by SNMP
    description: 'Template for IBM Storage Networking / IBM TS4300 / IBM Storage Protect ML3 tape library monitoring via SNMP.


      Built from supplied MIB files:

      - IBM-AUTOMATION-QUERY-MIB.mib

      - IBM-TS4300-MIB.mib

      - SNIA-SML-MIB.mib


      Uses numeric OIDs, so MIB files are not required for polling. MIB files are still useful on the Zabbix server/proxy for readable SNMP trap names.


      Designed for Zabbix 7.0 LTS and 6.4+ SNMP walk based low-level discovery. For Zabbix 6.0/5.x, convert SNMP walk LLD to legacy discovery[] syntax before importing.

      '
    groups:
    - name: Templates/IBM ML3
    items:
    - uuid: f184d2bdd38445449aaeb5d7cdaceaa4
      name: 'ML3: SNMP availability'
      type: INTERNAL
      key: zabbix[host,snmp,available]
      history: 7d
      valuemap:
        name: Zabbix interface availability
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: f5a058d42fed44eb97cf035148d344bc
        expression: max(/IBM ML3 Tape Library by SNMP/zabbix[host,snmp,available],5m)=0
        name: 'ML3: SNMP is unavailable'
        priority: AVERAGE
        opdata: 'Current SNMP availability: {ITEM.LASTVALUE1}'
        description: No SNMP data has been received from the host interface for 5 minutes.
        tags:
        - tag: scope
          value: availability
    - uuid: 50eed5afd8a047a9bf162c513c7bcee6
      name: 'ML3: IBM Automation Query MIB version'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.2.6.257.1.1.0
      key: ml3.ibm.query.mib.version
      delay: 1h
      history: 30d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: c3a88240d16a4c42acc741eec430a299
      name: 'ML3: SNIA SML MIB version'
      type: SNMP_AGENT
