zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: ce6532b20c444733b8614edc0cd5d531
    name: Templates/Server hardware
  templates:
  - uuid: c294adfa9a404c129c7902a9584cbff1
    template: Template Dell TL1000 TapeLibrary
    name: Template Dell TL1000 TapeLibrary
    description: Dell TL1000 / IBM TS2900 SNMP template completed from IBM-2900-MIB and formatted for Zabbix 7.4 YAML import.
    readme: '## Overview

      Dell PowerVault TL1000 is an OEM version of IBM TS2900 / IBM 3572-TL. This template uses numeric SNMP OIDs from IBM-2900-MIB,
      so the MIB file does not need to be installed on the Zabbix server.


      ## What was added from IBM-2900-MIB

      - IBM library inventory scalars: MIB revision, unit name, serial number, firmware, bus information, slot and trap recipient
      limits.

      - Controller, magazine, import/export slot, robot, online/offline and door status items.

      - Drive low-level discovery for drive inventory, state and status.

      - Slot low-level discovery for slot type and barcode label.

      - Event low-level discovery for emergency/error/warning events.

      - Trap client low-level discovery without collecting community/user name secrets.


      ## Compatibility notes

      - The template UUID and existing item UUIDs are retained from the previously converted Zabbix 7.4 template, so it should
      update that template cleanly.

      - The original hard-coded slot items are retained, while the new slot LLD gives complete dynamic slot coverage.

      - The original robot status OID was corrected from controller state to robotStatus.

      - Configure the host SNMP interface and community/security on the host, not inside this template.

      - Event discovery excludes informational severity 5 by default via {$TL1000.EVENT.INFO.MATCHES}.

      '
